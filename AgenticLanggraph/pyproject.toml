[project]
name = "agenticlanggraph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vi.S.Senthil kumar", email = "vissenthiltech@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.1",
    "langchain-groq>=1.1.3",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.11",
    "langsmith>=0.12.6",
    "python-dotenv>=1.2.3",
]

[project.scripts]
agenticlanggraph = "agenticlanggraph:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

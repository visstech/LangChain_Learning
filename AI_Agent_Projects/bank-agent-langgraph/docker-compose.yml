# Runs a local PostgreSQL database for this project.
# Start it with: docker compose up -d
# Stop it with:  docker compose down

version: "3.8"
services:
  postgres:
    image: postgres:16
    container_name: bank_agent_postgres
    environment:
      POSTGRES_USER: bankuser
      POSTGRES_PASSWORD: bankpass
      POSTGRES_DB: bankdb
    ports:
      - "5432:5432"
    volumes:
      - bank_pg_data:/var/lib/postgresql/data

volumes:
  bank_pg_data:
